name: Release Package

# This action will start when a correctly formatted tag is pushed (e.g. 0.1.0)

on:
  push:
    tags:
      - "release-*"
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    permissions:
      id-token: write   # required for NuGet trusted publishing (OIDC token issuance)
      contents: read    # required for actions/checkout (unlisted scopes default to none)

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-dotnet-

    - name: Setup .NET
      uses: actions/setup-dotnet@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'npm'
        cache-dependency-path: src/Umbraco.Community.BlockPreview.UI/package-lock.json

    # Build the backoffice (Lit/Vite) assets into wwwroot before packing.
    # The .csproj assumes the client assets are already built, so this must run first;
    # otherwise the package ships a stale frontend bundle.
    - name: Build frontend assets
      working-directory: src/Umbraco.Community.BlockPreview.UI
      run: |
        npm ci
        npm run build

    - name: Install Playwright browser (for frontend tests)
      working-directory: src/Umbraco.Community.BlockPreview.UI
      run: npx playwright install chromium

    - name: Run frontend tests
      working-directory: src/Umbraco.Community.BlockPreview.UI
      run: npm test

    - name: Build project
      run: dotnet build src\Umbraco.Community.BlockPreview\Umbraco.Community.BlockPreview.csproj --configuration Release

    - name: Run tests
      run: dotnet test tests\Umbraco.Community.BlockPreview.Tests\Umbraco.Community.BlockPreview.Tests.csproj --configuration Release --verbosity normal

    # Exchange the GitHub OIDC token for a short-lived nuget.org API key.
    # Run immediately before the push: the key is only valid for 1 hour.
    - name: NuGet login (trusted publishing)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      run: dotnet nuget push **\*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
